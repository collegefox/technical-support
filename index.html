<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أكاديمية الدعم الفني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ترويسة + شريط المراحل الخمس + لوحة عمل واحدة تتبدل حسب المرحلة، بطابع غرفة مراقبة الشبكة */
:root{
  --bg:#eef3f4; --surface:#ffffff; --surface2:#e6eef0; --ink:#10222a; --muted:#566b75; --line:#cfdce0;
  --accent:#0a766f; --accent-ink:#ffffff; --accent-soft:#d3ece9;
  --good:#1a7a43; --good-soft:#d8efe1; --bad:#b3261e; --bad-soft:#f7dedb; --warn:#8f5200; --warn-soft:#f8e8cc;
  --term-bg:#0b1519; --term-ink:#c8e6e2; --term-dim:#6f9a98;
  --f-body:'IBM Plex Sans Arabic',system-ui,sans-serif; --f-head:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a20; --surface:#13262e; --surface2:#1a3039; --ink:#e4eff1; --muted:#93a9b2; --line:#27414b;
  --accent:#42c6bc; --accent-ink:#052421; --accent-soft:#17403f;
  --good:#52c783; --good-soft:#14392a; --bad:#ff8a80; --bad-soft:#40201e; --warn:#f0b455; --warn-soft:#3e3017;
  --term-bg:#071014; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1a20; --surface:#13262e; --surface2:#1a3039; --ink:#e4eff1; --muted:#93a9b2; --line:#27414b;
  --accent:#42c6bc; --accent-ink:#052421; --accent-soft:#17403f;
  --good:#52c783; --good-soft:#14392a; --bad:#ff8a80; --bad-soft:#40201e; --warn:#f0b455; --warn-soft:#3e3017;
  --term-bg:#071014; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem)}
h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.hdr{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-bottom:16px}
.hdr p{color:var(--muted);max-width:60ch}
.overall{min-width:200px}
.overall small{color:var(--muted);display:block}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}

.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px;margin-block:4px 18px}
.ph{display:flex;gap:10px;align-items:center;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ph .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-family:var(--f-head);font-weight:700;font-size:.9rem}
.ph b{display:block;font-size:.92rem;line-height:1.3}
.ph span.s{font-size:.78rem;color:var(--muted)}
.ph[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ph[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.ph.done .n{background:var(--good);color:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,3vw,26px)}
.lead{color:var(--muted);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{background:var(--surface2);border-radius:10px;padding:12px 14px;min-width:0}
.box h3{font-size:.95rem;margin-bottom:6px;color:var(--accent)}
.box ul,.box ol{margin:0;padding-inline-start:20px}
.box li{margin-block:2px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.88rem;background:var(--surface)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .ok{margin-inline-start:6px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 20px;font-weight:600}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 14px;font-size:.95rem}
.fb.good{background:var(--good-soft);color:var(--ink);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.fb.info{background:var(--warn-soft);border:1px solid var(--warn)}

.ticket{border:1px dashed var(--accent);border-radius:12px;padding:12px 16px;background:var(--surface)}
.ticket .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);font-family:var(--f-mono);direction:ltr;justify-content:flex-end}
.ticket q{display:block;margin-top:6px;quotes:none;font-weight:500}

.anim{background:var(--surface2);border-radius:12px;padding:8px;display:grid;place-items:center}
.anim svg{width:100%;max-width:420px;height:auto}
.anim figcaption,.anim .cap{font-size:.82rem;color:var(--muted);text-align:center}
figure{margin:0}
svg .box-f{fill:var(--surface);stroke:var(--ink);stroke-width:2}
svg .ln{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
svg .arc{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round;opacity:.15;animation:pulse 1.8s infinite}
svg .arc.a2{animation-delay:.3s} svg .arc.a3{animation-delay:.6s}
svg .dash{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;fill:none;animation:flow 1s linear infinite}
svg .bad{fill:var(--bad)} svg .goodf{fill:var(--good)} svg .acc{fill:var(--accent)}
svg text{fill:var(--ink);font-family:var(--f-body);font-size:12px;text-anchor:middle}
svg text.w{fill:#fff;font-weight:700;font-size:14px}
svg .blink{animation:blink 1.1s steps(2,start) infinite}
svg .key{animation:key 2.6s ease-in-out infinite}
svg .paper{animation:paper 2.4s ease-in-out infinite}
svg .pkt{fill:var(--accent);animation:travel 3s linear infinite}
svg .pkt.p2{animation-delay:1.5s}
@keyframes pulse{0%,100%{opacity:.15}40%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes blink{50%{opacity:0}}
@keyframes key{0%{transform:translateX(0)}55%,100%{transform:translateX(54px)}}
@keyframes paper{0%{transform:translateY(-18px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:1}}
@keyframes travel{from{transform:translateX(0)}to{transform:translateX(240px)}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}svg .arc{opacity:1}}

.term{direction:ltr;text-align:left;background:var(--term-bg);color:var(--term-ink);font-family:var(--f-mono);font-size:.85rem;border-radius:10px;padding:12px;height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--term-dim)} .term .er{color:#ff8a80} .term .okc{color:#7be0a1}
.cmdline{direction:ltr;display:flex;gap:8px;margin-top:8px}
.cmdline input{flex:1;min-width:0;background:var(--term-bg);color:var(--term-ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:.9rem}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk li{display:flex;gap:10px;align-items:center}
.chk i{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem}
.chk li.on i{background:var(--good);border-color:var(--good);color:var(--bg)}
.chk li.on{color:var(--ink)} .chk li{color:var(--muted)}

.prog{font-size:.85rem;color:var(--muted)}
.skills{display:flex;flex-direction:column;gap:12px}
.sk{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center}
.sk .b{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.sk .b i{display:block;height:100%;border-radius:99px}
.lvl{font-size:.8rem;font-weight:600;text-align:left}
.verdict{border-radius:12px;padding:14px 18px;border:2px solid}
.verdict.ready{border-color:var(--good);background:var(--good-soft)}
.verdict.notyet{border-color:var(--warn);background:var(--warn-soft)}
.pill-g{color:var(--good)} .pill-w{color:var(--warn)} .pill-b{color:var(--bad)}
@media (max-width:520px){.sk{grid-template-columns:1fr 60px}.sk .b{grid-column:1/-1;order:3}}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="ar">
  <header class="hdr">
    <div>
      <h1>أكاديمية الدعم الفني</h1>
      <p>برنامج تأهيل موظفي الدعم الفني الجدد في الجامعة. تنتهي الرحلة بقدرتك على استقبال البلاغ، وتشخيصه، ومعالجته باستقلال، وتحديد متى تصعّده.</p>
    </div>
    <div class="overall"><small id="ovtxt">التقدم العام: 0 من 5 مراحل</small><div class="meter"><i id="ovbar" style="width:0%"></i></div></div>
  </header>
  <nav class="phases" id="nav" aria-label="مراحل البرنامج"></nav>
  <main class="panel" id="view" aria-live="polite"></main>
</div>

<script>

 {n:2,t:'المحاكاة التفاعلية',s:'بلاغات افتراضية بقرارات'},
 {n:3,t:'التدريب العملي',s:'جهاز افتراضي آمن'},

var TOPICS=[

  sym:['الجهاز متصل لكن المواقع لا تفتح','العنوان يبدأ بـ 169.254','العنوان الرقمي يفتح والاسم لا يفتح'],
  cause:['خادم DHCP لا يستجيب','كابل أو منفذ معطل','إعدادات DNS خاطئة','البوابة الافتراضية غير صحيحة'],

  ex:'طالب في المعمل يقول إن الإنترنت لا يعمل. ping 8.8.8.8 ينجح لكن nslookup يفشل. إذن الشبكة سليمة والعطل في DNS.',

  var st=sc.steps[S.sim.s],p=S.sim.picked;
  v.innerHTML='<div class="stack"><div class="row" style="justify-content:space-between"><h2>'+sc.t+'</h2><span class="prog">الخطوة '+(S.sim.s+1)+' من 3</span></div>'+
   '<div class="ticket"><div class="meta"><span>TICKET #'+(2040+S.sim.i)+'</span><span>'+sc.ch+'</span></div><b>'+sc.who+'</b><q>'+sc.txt+'</q></div>'+
   '<h3>'+st.q+'</h3><div class="opts">'+st.o.map(function(o,i){var c='opt';if(p!==null){if(o.ok)c+=' good';else if(i===p)c+=' bad'}return '<button class="'+c+'" data-o="'+i+'" '+(p!==null?'disabled':'')+'>'+o.t+'</button>'}).join('')+'</div>'+
   (p!==null?'<div class="fb '+(st.o[p].ok?'good':'bad')+'"><b>'+(st.o[p].ok?'قرار سليم. ':'قرار غير مناسب. ')+'</b>'+st.o[p].fb+(st.o[p].ok?'':' الإجابة الأنسب: '+st.o.filter(function(o){return o.ok})[0].t+'.')+'</div><div class="row"><button class="btn" id="nx">'+(S.sim.s<2?'الخطوة التالية':'إنهاء البلاغ')+'</button></div>':'')+'</div>';
  [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){var i=+b.dataset.o;S.sim.picked=i;S.sim.res[S.sim.i].push({skill:st.skill,ok:!!st.o[i].ok});r2()}});
  if($('#nx'))$('#nx').onclick=function(){S.sim.s++;S.sim.picked=null;r2()};
}

/* ============ المرحلة 3 ============ */
var OBJ=[['ip','قراءة إعدادات الشبكة بالأمر ipconfig'],['loop','فحص بطاقة الشبكة: ping 127.0.0.1'],['gw','فحص البوابة: ping 10.20.4.1'],['cable','فحص الكابل (زر الفحص المادي)'],['renew','تجديد العنوان: ipconfig /renew'],['net','فحص الإنترنت: ping 8.8.8.8'],['dns','فحص DNS: nslookup portal.univ.edu']];
var HINTS={ip:'ابدأ بقراءة الإعدادات: اكتب ipconfig',loop:'افحص بطاقة الشبكة نفسها: ping 127.0.0.1',gw:'افحص الوصول للبوابة: ping 10.20.4.1',cable:'العنوان 169.254 يعني أن الجهاز لم يجد خادم DHCP. اضغط «فحص الكابل».',renew:'بعد إصلاح الكابل اطلب عنوانا جديدا: ipconfig /renew',net:'اختبر الخروج للإنترنت: ping 8.8.8.8',dns:'اختبر الأسماء: nslookup portal.univ.edu'};
function newLab(){return {cable:false,fixed:false,ob:{},hints:0,log:[['p','جهاز افتراضي PC-LAB-07. البلاغ: «لا يوجد إنترنت». اكتب help لعرض الأوامر.']]}}
function out(t,c){S.lab.log.push([c||'',t])}
function labCmd(raw){
  var L=S.lab,c=raw.trim().toLowerCase().replace(/\s+/g,' ');L.log.push(['p','C:\\> '+raw]);
  if(!c)return;
  if(c==='help')out('الأوامر: ipconfig | ipconfig /renew | ping <عنوان> | nslookup <اسم> | clear');
  else if(c==='clear'){L.log=[]}
  else if(c==='ipconfig'||c==='ipconfig /all'){L.ob.ip=1;
    out(L.fixed?'Ethernet adapter:\n   IPv4 Address . . . : 10.20.4.57\n   Subnet Mask  . . . : 255.255.255.0\n   Default Gateway  . : 10.20.4.1\n   DNS Servers  . . . : 10.20.0.10':'Ethernet adapter:\n   Autoconfiguration IPv4 Address : 169.254.33.12\n   Subnet Mask  . . . : 255.255.0.0\n   Default Gateway  . : (فارغ)\n   DNS Servers  . . . : (فارغ)')}
  else if(c==='ping 127.0.0.1'||c==='ping localhost'){L.ob.loop=1;out('Reply from 127.0.0.1: time<1ms\nبطاقة الشبكة وحزمة TCP/IP تعملان.','okc')}
  else if(c==='ping 10.20.4.1'){if(L.fixed){L.ob.gw=1;out('Reply from 10.20.4.1: time=2ms\nالبوابة تستجيب.','okc')}else{out('Destination host unreachable.\nالجهاز بلا عنوان صحيح، فلا يصل للبوابة.','er')}}
  else if(c==='ping 8.8.8.8'){if(L.fixed){L.ob.net=1;out('Reply from 8.8.8.8: time=14ms\nالخروج إلى الإنترنت سليم.','okc')}else out('General failure.','er')}
  else if(c==='ipconfig /renew'){if(!L.cable){out('فشل: Media disconnected. لا توجد وصلة فيزيائية، فلا يمكن للجهاز الوصول إلى DHCP.','er')}else{L.fixed=true;L.ob.renew=1;out('تم الحصول على عنوان جديد: 10.20.4.57','okc')}}
  else if(c==='nslookup portal.univ.edu'||c==='nslookup'){if(L.fixed){L.ob.dns=1;out('Server: dns1.univ.edu (10.20.0.10)\nName:   portal.univ.edu\nAddress: 10.20.0.45','okc')}else out('DNS request timed out.','er')}
  else if(c.indexOf('ping ')===0)out('Request timed out.','er');
  else out('أمر غير معروف. اكتب help.','er');
  checkLab();
}
function checkLab(){
  var all=OBJ.every(function(o){return S.lab.ob[o[0]]});
  if(all&&!S.labDone){S.labDone=true;S.labRes=[{skill:'net',ok:true},{skill:'method',ok:S.lab.hints<=1}];renderNav()}
}
function r3(){
  if(!S.lab)S.lab=newLab();
  var L=S.lab;
  $('#view').innerHTML='<div class="stack"><div><h2>المرحلة الثالثة: التدريب العملي</h2><p class="lead">جهاز افتراضي آمن. لن تتأثر أي أجهزة حقيقية. أنجز الأهداف السبعة بالتسلسل المنطقي.</p></div>'+
   '<div class="grid2"><div class="stack" style="min-width:0"><div class="term" id="term" tabindex="0" aria-label="الطرفية"></div>'+
    '<form class="cmdline" id="f"><input id="cmd" autocomplete="off" spellcheck="false" placeholder="اكتب الأمر هنا" aria-label="الأمر"><button class="btn" type="submit">تنفيذ</button></form>'+
    '<div class="row" style="direction:ltr;justify-content:flex-start">'+['ipconfig','ping 127.0.0.1','ping 10.20.4.1','ipconfig /renew','ping 8.8.8.8','nslookup portal.univ.edu'].map(function(x){return '<button class="chip q" type="button" style="cursor:pointer;font-family:var(--f-mono)">'+x+'</button>'}).join('')+'</div></div>'+
    '<div class="stack"><div class="box"><h3>الأهداف</h3><ul class="chk">'+OBJ.map(function(o){return '<li class="'+(L.ob[o[0]]?'on':'')+'"><i>'+(L.ob[o[0]]?'✓':'')+'</i><span>'+o[1]+'</span></li>'}).join('')+'</ul></div>'+
    '<div class="row"><button class="btn alt" id="cab">فحص الكابل</button><button class="btn alt" id="hint">تلميح</button><button class="btn alt" id="rst">إعادة الضبط</button></div>'+
    '<div id="hbox"></div>'+
    (S.labDone?'<div class="fb good"><b>أنجزت التدريب.</b> المشكلة كانت وصلة فيزيائية مفصولة، وتتبعت السبب من العنوان 169.254 إلى الإصلاح. '+(L.hints>1?'استخدمت '+L.hints+' تلميحات.':'')+'</div><button class="btn" id="nx">انتقل إلى الاختبار</button>':'')+'</div></div></div>';
  var term=$('#term');
  term.innerHTML=L.log.map(function(l){return '<div class="'+(l[0]||'')+'">'+l[1].replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>'}).join('');
  term.scrollTop=term.scrollHeight;
  $('#f').onsubmit=function(e){e.preventDefault();var v=$('#cmd').value;labCmd(v);r3();$('#cmd').focus()};
  [].forEach.call(document.querySelectorAll('.q'),function(b){b.onclick=function(){labCmd(b.textContent);r3()}});
  $('#cab').onclick=function(){
    out('فحص مادي: كابل الشبكة مفصول جزئيا من المنفذ. تمت إعادة توصيله.','okc');L.cable=true;L.ob.cable=1;checkLab();r3()};
  $('#hint').onclick=function(){
    var n=OBJ.filter(function(o){return !L.ob[o[0]]})[0];if(!n){return}
    L.hints++;$('#hbox').innerHTML='<div class="fb info">'+HINTS[n[0]]+'</div>'};
  $('#rst').onclick=function(){S.lab=newLab();S.labDone=false;S.labRes=[];renderNav();r3()};
  if($('#nx'))$('#nx').onclick=function(){go(4)};
}

/* ============ المرحلة 4 ============ */
function r4(){
  var v=$('#view'),E=S.ex;
  if(S.exRes&&!E){
    v.innerHTML='<div class="stack"><h2>تم تسليم الاختبار</h2><p class="lead">لا تُعرض الإجابات الصحيحة. ستجد نتيجتك حسب المهارة في تقرير الجاهزية.</p><div class="row"><button class="btn" id="nx">عرض التقرير</button><button class="btn alt" id="re">إعادة الاختبار بترتيب جديد</button></div></div>';
    $('#nx').onclick=function(){go(5)};$('#re').onclick=function(){S.exRes=null;renderNav();r4()};return;
  }
  if(!E){
    v.innerHTML='<div class="stack"><div><h2>المرحلة الرابعة: الاختبار والتقييم</h2><p class="lead">'+EXAM.length+' سيناريوهات مفاجئة بترتيب عشوائي. لا تظهر نتيجة أي سؤال ولا الحل أثناء الاختبار، لأن المقصود قياس قدرتك على التشخيص واتخاذ القرار بنفسك.</p></div>'+
     '<div class="fb info">لا تلميحات ولا رجوع للمراحل السابقة أثناء الاختبار. الزمن مفتوح.</div><div class="row"><button class="btn" id="go">ابدأ الاختبار</button></div></div>';
    $('#go').onclick=function(){S.ex={i:0,qs:shuffle(EXAM).map(function(q){return {skill:q.skill,t:q.t,o:shuffle(q.o.map(function(x,i){return {t:x,ok:i===0}}))}}),a:[],sel:null};r4()};return;
  }
  var q=E.qs[E.i];
  v.innerHTML='<div class="stack"><div class="row" style="justify-content:space-between"><h2>سيناريو '+(E.i+1)+' من '+E.qs.length+'</h2><span class="prog">'+SK[q.skill]+'</span></div>'+
   '<div class="meter"><i style="width:'+(E.i/E.qs.length*100)+'%"></i></div>'+
   '<div class="ticket"><q>'+q.t+'</q></div>'+
   '<div class="opts">'+q.o.map(function(o,i){return '<button class="opt'+(E.sel===i?' sel':'')+'" data-o="'+i+'">'+o.t+'</button>'}).join('')+'</div>'+
   '<div class="row"><button class="btn" id="nx" '+(E.sel===null?'disabled':'')+'>'+(E.i<E.qs.length-1?'التالي':'تسليم الاختبار')+'</button></div></div>';
  [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){E.sel=+b.dataset.o;r4()}});
  $('#nx').onclick=function(){
    E.a.push({skill:q.skill,ok:q.o[E.sel].ok});E.sel=null;E.i++;
    if(E.i>=E.qs.length){S.exRes=E.a;S.ex=null;renderNav()}
    r4();
  };
}

/* ============ المرحلة 5 ============ */
function calc(){
  var acc={};Object.keys(SK).forEach(function(k){acc[k]={w:0,s:0}});
  function add(a,w){a.forEach(function(r){var x=acc[r.skill];x.w+=w;if(r.ok)x.s+=w})}
  add(Object.keys(S.quiz).map(function(id){var t=TOPICS.filter(function(x){return x.id===id})[0];return {skill:t.quiz.skill,ok:S.quiz[id].ok}}),0.5);
  Object.keys(S.sim.res).forEach(function(i){if(S.sim.fin[i])add(S.sim.res[i],1.5)});
  add(S.labRes,1.5);
  if(S.exRes)add(S.exRes,2);
  var out={};Object.keys(acc).forEach(function(k){out[k]=acc[k].w?Math.round(acc[k].s/acc[k].w*100):null});
  return out;
}
function lvl(p){if(p===null)return ['لم يُقيَّم','var(--muted)','pill-w'];if(p>=80)return ['متقن','var(--good)','pill-g'];if(p>=50)return ['يحتاج تطويرا','var(--warn)','pill-w'];return ['ضعيف','var(--bad)','pill-b']}
var TOPICOF={net:'الاتصال بالشبكة والواي فاي',sec:'الحسابات والأمن (الموضوع الثالث)',hw:'الطابعات والأجهزة (الموضوع الرابع)',method:'خطوات التشخيص في كل المواضيع',comm:'سيناريوهات التواصل في المحاكاة',esc:'فقرات «متى تصعّد؟» في كل موضوع'};
function r5(){
  S.viewed=true;renderNav();
  var sc=calc(),ks=Object.keys(SK),vals=ks.map(function(k){return sc[k]}).filter(function(x){return x!==null});
  var avg=vals.length?Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length):0;
  var phasesDone=[1,2,3,4].every(isDone);
  var low=ks.filter(function(k){return sc[k]!==null&&sc[k]<50});
  var ready=phasesDone&&avg>=75&&!low.length&&vals.length===ks.length;
  var strong=ks.filter(function(k){return sc[k]!==null&&sc[k]>=80}),dev=ks.filter(function(k){return sc[k]===null||sc[k]<80});
  var d=new Date().toLocaleDateString('ar-AE',{year:'numeric',month:'long',day:'numeric'});
  $('#view').innerHTML='<div class="stack"><div class="row" style="justify-content:space-between"><div><h2>المرحلة الخامسة: تقرير الجاهزية</h2><p class="lead">تاريخ التقرير: '+d+'</p></div></div>'+
   '<div class="verdict '+(ready?'ready':'notyet')+'"><h3>'+(ready?'جاهز للعمل المستقل':'غير جاهز بعد للعمل المستقل')+'</h3><p>المعدل العام '+avg+'%. '+
     (ready?'أتممت المراحل الأربع وحققت مستوى مقبولا في كل المهارات.':(!phasesDone?'لم تُنجز كل المراحل بعد. أكملها ليكتمل التقييم.':low.length?'توجد مهارات دون 50%: '+low.map(function(k){return SK[k]}).join('، ')+'.':'يلزم معدل عام لا يقل عن 75% مع تقييم كل المهارات.'))+'</p></div>'+
   '<div class="skills">'+ks.map(function(k){var p=sc[k],l=lvl(p);return '<div class="sk"><b>'+SK[k]+'</b><div class="b"><i style="width:'+(p||0)+'%;background:'+l[1]+'"></i></div><span class="lvl '+l[2]+'">'+(p===null?'—':p+'%')+' '+l[0]+'</span></div>'}).join('')+'</div>'+
   '<div class="grid2"><div class="box"><h3>مهارات أتقنتها</h3>'+(strong.length?list(strong.map(function(k){return SK[k]})):'<p>لا توجد مهارة بلغت 80% بعد.</p>')+'</div>'+
   '<div class="box"><h3>مهارات تحتاج تطويرا</h3>'+(dev.length?list(dev.map(function(k){return SK[k]+': راجع «'+TOPICOF[k]+'»'})):'<p>لا توجد مهارات تحتاج تطويرا.</p>')+'</div></div>'+
   '<div class="row"><button class="btn alt" data-g="1">مراجعة النظري</button><button class="btn alt" data-g="2">إعادة المحاكاة</button><button class="btn alt" data-g="4">إعادة الاختبار</button></div></div>';
  [].forEach.call(document.querySelectorAll('[data-g]'),function(b){b.onclick=function(){if(b.dataset.g==='4'){S.exRes=null;S.ex=null}go(+b.dataset.g)}});
}

go(1);
</script>
